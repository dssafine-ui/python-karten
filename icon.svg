<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Python Karten</title>
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f86c9"/>
      <stop offset="1" stop-color="#1d4a78"/>
    </linearGradient>
  </defs>
  <!-- Hintergrund über die ganze Fläche, damit das Symbol auch als runde oder abgerundete Form ausgeschnitten sauber aussieht -->
  <rect width="512" height="512" fill="url(#grund)"/>
  <!-- hintere Karte -->
  <rect x="150" y="130" width="236" height="256" rx="30" fill="#ffffff" fill-opacity="0.35" transform="rotate(11 256 256)"/>
  <!-- vordere Karte mit "==" aus zwei Balken und einem gelben Cursor -->
  <g transform="rotate(-7 256 256)">
    <rect x="128" y="120" width="256" height="272" rx="34" fill="#ffffff"/>
    <rect x="180" y="204" width="152" height="28" rx="14" fill="#1d4a78"/>
    <rect x="180" y="256" width="152" height="28" rx="14" fill="#1d4a78"/>
    <rect x="180" y="320" width="66" height="24" rx="12" fill="#ffd43b"/>
  </g>
</svg>
