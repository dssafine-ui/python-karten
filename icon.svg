<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Python Karten</title>
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86c540"/>
      <stop offset="1" stop-color="#3e8e2a"/>
    </linearGradient>
    <clipPath id="seite">
      <rect x="124" y="112" width="264" height="288" rx="26"/>
    </clipPath>
  </defs>
  <!-- Hintergrund über die ganze Fläche, damit das Symbol auch als runde oder abgerundete Form ausgeschnitten sauber aussieht -->
  <rect width="512" height="512" fill="url(#grund)"/>
  <!-- hintere Karte -->
  <rect x="124" y="112" width="264" height="288" rx="26" fill="#ffffff" fill-opacity="0.38" transform="rotate(9 256 256)"/>
  <!-- Schatten und Seite wie in einem Code-Editor: grauer Streifen mit Zeilennummern, bunter Code, aktive Zeile mit Cursor -->
  <rect x="124" y="120" width="264" height="288" rx="26" fill="#000000" fill-opacity="0.18"/>
  <rect x="124" y="112" width="264" height="288" rx="26" fill="#ffffff"/>
  <g clip-path="url(#seite)">
    <rect x="124" y="112" width="264" height="10" fill="#ff8c00"/>
    <rect x="124" y="122" width="56" height="278" fill="#e4e4e4"/>
    <rect x="180" y="122" width="3" height="278" fill="#c8c8c8"/>
    <rect x="183" y="253" width="205" height="42" fill="#e8e8ff"/>
    <!-- Zeilennummern -->
    <g fill="#7a7a7a">
      <rect x="144" y="143" width="14" height="10" rx="3"/>
      <rect x="144" y="185" width="14" height="10" rx="3"/>
      <rect x="144" y="227" width="14" height="10" rx="3"/>
      <rect x="144" y="269" width="14" height="10" rx="3"/>
      <rect x="144" y="311" width="14" height="10" rx="3"/>
      <rect x="144" y="353" width="14" height="10" rx="3"/>
    </g>
    <!-- Kommentar -->
    <rect x="198" y="140" width="128" height="16" rx="8" fill="#2e9b3a"/>
    <!-- def und Name -->
    <rect x="198" y="182" width="44" height="16" rx="8" fill="#1f4fe0"/>
    <rect x="252" y="182" width="74" height="16" rx="8" fill="#2b2b2b"/>
    <!-- eingerückt: Funktion und Text -->
    <rect x="222" y="224" width="58" height="16" rx="8" fill="#8a1f9e"/>
    <rect x="290" y="224" width="62" height="16" rx="8" fill="#8c8c8c"/>
    <!-- aktive Zeile: Schlüsselwort, Zahl und Cursor -->
    <rect x="222" y="266" width="34" height="16" rx="8" fill="#1f4fe0"/>
    <rect x="266" y="266" width="30" height="16" rx="8" fill="#e07000"/>
    <rect x="306" y="262" width="5" height="24" fill="#141414"/>
    <rect x="222" y="308" width="46" height="16" rx="8" fill="#2b2b2b"/>
    <rect x="278" y="308" width="56" height="16" rx="8" fill="#8c8c8c"/>
    <rect x="198" y="350" width="44" height="16" rx="8" fill="#1f4fe0"/>
    <rect x="252" y="350" width="92" height="16" rx="8" fill="#2b2b2b"/>
  </g>
</svg>
